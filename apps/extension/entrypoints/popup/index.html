<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ChatBot Skriv</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 260px;
        padding: 14px;
        margin: 0;
        font-size: 13px;
        color: #111;
      }
      button {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: none;
        background: #111111;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        background: #333333;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 500;
      }
      .hint {
        margin-top: 8px;
        color: #777;
        font-size: 11.5px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- The panel's own mark and its sentence case. This line was the last
         piece of the pre-redesign identity left in the product: a pilcrow in a
         black box and MONO-UPPERCASE, which nothing else has looked like since
         the panel was redrawn. It is also the first surface a new user meets,
         because the toolbar icon is what they click before they know the
         round button on the page exists. -->
    <p class="brand"><img src="/icon/128.png" alt="" width="24" height="24" />ChatBot Skriv</p>
    <button id="toggle">Åbn assistenten på denne side</button>
    <p class="hint">Tastaturgenvej: <b>Alt+Shift+A</b></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
